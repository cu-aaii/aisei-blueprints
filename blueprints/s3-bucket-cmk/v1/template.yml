AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  s3-bucket-cmk v1 — one private S3 bucket encrypted with the workspace CMK: public access blocked at
  the bucket, TLS required, versioning on, a lifecycle policy that actually expires old versions, and
  a bucket policy that denies anything else. Optional access logging to a second bucket.

Metadata:
  Blueprint:
    Name: 's3-bucket-cmk'
    Version: 'v1'

  'AWS::CloudFormation::Interface':
    ParameterGroups:
      - Label:
          default: 'Naming'
        Parameters:
          - 'Application'
          - 'BucketPurpose'
      - Label:
          default: 'Lifecycle'
        Parameters:
          - 'NoncurrentVersionExpirationDays'
          - 'CurrentVersionExpirationDays'
          - 'TransitionToInfrequentAccessDays'
          - 'AbortIncompleteUploadDays'
      - Label:
          default: 'Options'
        Parameters:
          - 'EnableAccessLogging'
          - 'AllowedPrincipalArn'
      - Label:
          default: 'Encryption'
        Parameters:
          - 'KmsKeyArn'

Parameters:
  Application:
    Type: 'String'
    Description: 'The workspace name — first segment of every SSM path, and the Application tag value.'
    AllowedPattern: '[a-z0-9]{2,10}'
    ConstraintDescription: 'two to ten lowercase letters or digits'

  BucketPurpose:
    Type: 'String'
    Description: >-
      What the bucket is for — uploads, exports, backups. Part of the name, which is
      <workspace>-<region>-<account>-<purpose>. Renaming REPLACES the bucket, and a replacement whose
      old copy is retained holds the name, so the update fails rather than silently forking your data.
    AllowedPattern: '[a-z0-9][a-z0-9-]{1,20}'
    ConstraintDescription: 'lowercase letters, digits and hyphens, 2 to 21 characters'

  NoncurrentVersionExpirationDays:
    Type: 'Number'
    Description: >-
      When superseded versions are deleted. Versioning without this is an unbounded bill: every
      overwrite keeps the old bytes forever, and nobody notices until the storage line moves.
    Default: 90
    MinValue: 1
    MaxValue: 3650

  CurrentVersionExpirationDays:
    Type: 'Number'
    Description: >-
      When live objects are deleted, or 0 to keep them indefinitely. Retention of the data itself is a
      per-bucket decision, so the default keeps everything.
    Default: 0
    MinValue: 0
    MaxValue: 3650

  TransitionToInfrequentAccessDays:
    Type: 'Number'
    Description: >-
      Age at which objects move to Standard-IA, roughly halving storage cost, or 0 for no transition.
      Below 128 KB an object costs MORE in IA than Standard because of the 128 KB minimum billable
      size — so this is for large objects, not for many small ones.
    Default: 0
    MinValue: 0
    MaxValue: 3650

  AbortIncompleteUploadDays:
    Type: 'Number'
    Description: >-
      Age at which abandoned multipart uploads are cleaned up. Their parts are invisible in the console
      object list and billed as storage indefinitely — this is the single most common source of S3
      spend nobody can account for.
    Default: 7
    MinValue: 1
    MaxValue: 365

  EnableAccessLogging:
    Type: 'String'
    Description: >-
      Create a second bucket and log every request to it. Worth it for anything holding sensitive data;
      it roughly doubles the fixed cost and the log bucket needs its own lifecycle, which it gets.
    Default: 'false'
    AllowedValues: ['true', 'false']

  AllowedPrincipalArn:
    Type: 'String'
    Description: >-
      Optional single IAM role ARN — a task role or a function role — granted read and write on this
      bucket by the bucket policy, in addition to whatever its own IAM policy allows. Empty means the
      bucket policy grants nothing and access is entirely by IAM policy, which is the usual case.
    Default: ''

  KmsKeyArn:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Description: >-
      SSM path to the workspace CMK. A reader needs kms:Decrypt on this key as well as s3:GetObject —
      an IAM policy granting only the S3 action fails with AccessDenied naming S3, not KMS.
    Default: '/none/kms-key-arn'

Conditions:
  HasCurrentVersionExpiration: !Not [!Equals [!Ref 'CurrentVersionExpirationDays', 0]]
  HasIaTransition: !Not [!Equals [!Ref 'TransitionToInfrequentAccessDays', 0]]
  EnableAccessLogging: !Equals [!Ref 'EnableAccessLogging', 'true']
  HasAllowedPrincipal: !Not [!Equals [!Ref 'AllowedPrincipalArn', '']]

Resources:
  # The log bucket cannot log to itself, so it is deliberately simpler: no logging configuration, and
  # SSE-S3 rather than the CMK -- S3 log delivery cannot use a customer-managed key, and a CMK here
  # makes log delivery fail silently with no error surface anywhere.
  AccessLogBucket:
    Type: 'AWS::S3::Bucket'
    Condition: 'EnableAccessLogging'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      BucketName: !Sub '${Application}-${AWS::Region}-${AWS::AccountId}-${BucketPurpose}-logs'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'AES256'
            BucketKeyEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: 'BucketOwnerEnforced'
      VersioningConfiguration:
        Status: 'Enabled'
      LifecycleConfiguration:
        Rules:
          - Id: 'expire-logs'
            Status: 'Enabled'
            ExpirationInDays: 365
            NoncurrentVersionExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Resource'
          Value: !Sub 's3-bucket-${BucketPurpose}-logs'

  AccessLogBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Condition: 'EnableAccessLogging'
    Properties:
      Bucket: !Ref 'AccessLogBucket'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: 'DenyInsecureTransport'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt 'AccessLogBucket.Arn'
              - !Sub '${AccessLogBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'
          # SourceAccount and SourceArn together: without them any account's bucket could name this
          # one as its log destination (the confused-deputy shape).
          - Sid: 'AllowS3LogDelivery'
            Effect: 'Allow'
            Principal:
              Service: 'logging.s3.amazonaws.com'
            Action: 's3:PutObject'
            Resource: !Sub '${AccessLogBucket.Arn}/s3-access-logs/*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnLike:
                'aws:SourceArn': !Sub 'arn:${AWS::Partition}:s3:::${Application}-${AWS::Region}-${AWS::AccountId}-${BucketPurpose}'

  # Named explicitly: <workspace>-<region>-<account>-<purpose> is globally unique without being
  # guessable, and 10+24+12+21+3 hyphens = 70 against S3's 63 at the extremes -- hence the tight
  # AllowedPattern on BucketPurpose. Retained on delete: a bucket is the data.
  Bucket:
    Type: 'AWS::S3::Bucket'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      BucketName: !Sub '${Application}-${AWS::Region}-${AWS::AccountId}-${BucketPurpose}'
      # All four, always. Three of the four are the account-level default now, but a bucket that
      # states its own posture cannot be undone by an account-level change.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'aws:kms'
              KMSMasterKeyID: !Ref 'KmsKeyArn'
            # Without this every single GET and PUT is a separate KMS API call, billed per request.
            # On a high-traffic bucket the KMS line can exceed the S3 line. It caches the data key
            # at the bucket level and is a pure win.
            BucketKeyEnabled: true
      OwnershipControls:
        Rules:
          # ACLs disabled entirely. Every historical S3 public-exposure incident involved an ACL.
          - ObjectOwnership: 'BucketOwnerEnforced'
      VersioningConfiguration:
        Status: 'Enabled'
      LoggingConfiguration: !If
        - 'EnableAccessLogging'
        - DestinationBucketName: !Ref 'AccessLogBucket'
          LogFilePrefix: 's3-access-logs/'
        - !Ref 'AWS::NoValue'
      LifecycleConfiguration:
        Rules:
          - Id: 'expire-noncurrent-versions'
            Status: 'Enabled'
            NoncurrentVersionExpirationInDays: !Ref 'NoncurrentVersionExpirationDays'
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: !Ref 'AbortIncompleteUploadDays'
            ExpirationInDays: !If
              - 'HasCurrentVersionExpiration'
              - !Ref 'CurrentVersionExpirationDays'
              - !Ref 'AWS::NoValue'
            Transitions: !If
              - 'HasIaTransition'
              - - StorageClass: 'STANDARD_IA'
                  TransitionInDays: !Ref 'TransitionToInfrequentAccessDays'
              - !Ref 'AWS::NoValue'
      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Resource'
          Value: !Sub 's3-bucket-${BucketPurpose}'

  BucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref 'Bucket'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # An explicit Deny cannot be overridden by any IAM policy, so these two hold regardless of
          # what a role is granted elsewhere.
          - Sid: 'DenyInsecureTransport'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt 'Bucket.Arn'
              - !Sub '${Bucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

          # Refuses an upload that asks for any encryption other than this key. Without it a caller
          # can write an object with SSE-S3 and the bucket default is simply not applied -- the
          # object lands unencrypted-by-CMK and nothing reports it.
          - Sid: 'DenyWrongEncryption'
            Effect: 'Deny'
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Sub '${Bucket.Arn}/*'
            Condition:
              StringNotEqualsIfExists:
                's3:x-amz-server-side-encryption-aws-kms-key-id': !Ref 'KmsKeyArn'

          - !If
            - 'HasAllowedPrincipal'
            - Sid: 'AllowNamedPrincipal'
              Effect: 'Allow'
              Principal:
                AWS: !Ref 'AllowedPrincipalArn'
              Action:
                - 's3:GetObject'
                - 's3:PutObject'
                - 's3:DeleteObject'
                - 's3:ListBucket'
              Resource:
                - !GetAtt 'Bucket.Arn'
                - !Sub '${Bucket.Arn}/*'
            - !Ref 'AWS::NoValue'

Outputs:
  BucketName:
    Description: 'Bucket name — put this in the consuming service environment'
    Value: !Ref 'Bucket'
    Export:
      Name: !Sub '${AWS::StackName}-bucket-name'

  BucketArn:
    Description: >-
      Bucket ARN. A consuming IAM policy needs BOTH this (for ListBucket) and this + /* (for object
      actions) — they are different resources and granting only one is the usual mistake.
    Value: !GetAtt 'Bucket.Arn'
    Export:
      Name: !Sub '${AWS::StackName}-bucket-arn'

  BucketDomainName:
    Description: 'Regional domain name, for a presigned URL or a CloudFront origin'
    Value: !GetAtt 'Bucket.RegionalDomainName'

  AccessLogBucketName:
    Description: 'The access log bucket, or the literal none when logging is off'
    Value: !If ['EnableAccessLogging', !Ref 'AccessLogBucket', 'none']
