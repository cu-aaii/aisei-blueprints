AWSTemplateFormatVersion: '2010-09-09'

Description: >-
  dynamodb-table v1 — one DynamoDB table, encrypted with the workspace CMK, with optional
  point-in-time recovery, TTL and one global secondary index. Serverless: no subnets, no security
  group, nothing to patch, and $0 idle if billing is on-demand.

Metadata:
  Blueprint:
    Name: 'dynamodb-table'
    Version: 'v1'

  'AWS::CloudFormation::Interface':
    ParameterGroups:
      - Label:
          default: 'Naming'
        Parameters:
          - 'Application'
          - 'TableName'
      - Label:
          default: 'Key schema — cannot be changed without replacing the table'
        Parameters:
          - 'PartitionKeyName'
          - 'PartitionKeyType'
          - 'SortKeyName'
          - 'SortKeyType'
      - Label:
          default: 'Capacity'
        Parameters:
          - 'BillingMode'
          - 'ReadCapacityUnits'
          - 'WriteCapacityUnits'
      - Label:
          default: 'Durability and lifecycle'
        Parameters:
          - 'EnablePointInTimeRecovery'
          - 'TimeToLiveAttributeName'
      - Label:
          default: 'Optional index'
        Parameters:
          - 'IndexPartitionKeyName'
          - 'IndexSortKeyName'
      - Label:
          default: 'Encryption'
        Parameters:
          - 'KmsKeyArn'

Parameters:
  Application:
    Type: 'String'
    Description: 'The workspace name — first segment of every SSM path, and the Application tag value.'
    AllowedPattern: '[a-z0-9]{2,10}'
    ConstraintDescription: 'two to ten lowercase letters or digits'

  TableName:
    Type: 'String'
    Description: >-
      Table name, unqualified. The stack prefixes it with the workspace, so "sessions" becomes
      "<workspace>-sessions". Renaming this REPLACES the table and loses every item.
    AllowedPattern: '[a-z0-9][a-z0-9-]{1,48}'
    ConstraintDescription: 'lowercase letters, digits and hyphens; 2 to 49 characters'

  PartitionKeyName:
    Type: 'String'
    Description: >-
      Partition key attribute name. Part of the key schema, which is immutable: changing it replaces
      the table.
    AllowedPattern: '[A-Za-z][A-Za-z0-9_]{0,254}'
    ConstraintDescription: 'a letter followed by letters, digits or underscores'

  PartitionKeyType:
    Type: 'String'
    Description: 'S string, N number, B binary.'
    Default: 'S'
    AllowedValues: ['S', 'N', 'B']

  SortKeyName:
    Type: 'String'
    Description: >-
      Sort key attribute name, or empty for a table keyed on the partition key alone. Adding one later
      replaces the table, so decide now: if items will ever need ordering or a range query within a
      partition, set it.
    Default: ''

  SortKeyType:
    Type: 'String'
    Description: 'Ignored when SortKeyName is empty.'
    Default: 'S'
    AllowedValues: ['S', 'N', 'B']

  BillingMode:
    Type: 'String'
    Description: >-
      PAY_PER_REQUEST costs nothing when idle and is the right default. PROVISIONED is cheaper only
      above roughly 20 percent sustained utilisation.
    Default: 'PAY_PER_REQUEST'
    AllowedValues: ['PAY_PER_REQUEST', 'PROVISIONED']

  ReadCapacityUnits:
    Type: 'Number'
    Description: 'Ignored unless BillingMode is PROVISIONED.'
    Default: 5
    MinValue: 1

  WriteCapacityUnits:
    Type: 'Number'
    Description: 'Ignored unless BillingMode is PROVISIONED.'
    Default: 5
    MinValue: 1

  EnablePointInTimeRecovery:
    Type: 'String'
    Description: >-
      Continuous backup with 35-day restore-to-second. Costs roughly the table's storage price again.
      Turn it off only for a table you would be willing to lose entirely.
    Default: 'true'
    AllowedValues: ['true', 'false']

  TimeToLiveAttributeName:
    Type: 'String'
    Description: >-
      Attribute holding a Unix-epoch expiry, or empty for no TTL. Deletion is free but not prompt —
      typically within 48 hours, so this is a cost control, not a correctness one. Never rely on it to
      enforce a retention deadline.
    Default: ''

  IndexPartitionKeyName:
    Type: 'String'
    Description: >-
      Partition key for one global secondary index, or empty for no index. The index projects ALL
      attributes, which doubles storage for the indexed items.
    Default: ''

  IndexSortKeyName:
    Type: 'String'
    Description: 'Sort key for the index. Requires IndexPartitionKeyName.'
    Default: ''

  KmsKeyArn:
    Type: 'AWS::SSM::Parameter::Value<String>'
    Description: >-
      SSM path to the workspace CMK. A customer-managed key rather than the AWS-owned default, so key
      access is auditable and revocable per workspace.
    Default: '/none/kms-key-arn'

Rules:
  # A change set does NOT evaluate Rules -- these fire on create/update/execute only. The offline
  # mirror in the platform's `manage.py validate` is what catches them before a deploy.
  SortKeyTypeRequiresSortKey:
    RuleCondition:
      'Fn::Not':
        - 'Fn::Equals': [!Ref 'SortKeyName', '']
    Assertions:
      - Assert:
          'Fn::Not':
            - 'Fn::Equals': [!Ref 'SortKeyType', '']
        AssertDescription: 'SortKeyType is required when SortKeyName is set'

  IndexSortKeyRequiresIndexPartitionKey:
    RuleCondition:
      'Fn::Not':
        - 'Fn::Equals': [!Ref 'IndexSortKeyName', '']
    Assertions:
      - Assert:
          'Fn::Not':
            - 'Fn::Equals': [!Ref 'IndexPartitionKeyName', '']
        AssertDescription: >-
          IndexPartitionKeyName is required when IndexSortKeyName is set — a GSI cannot have a sort key
          alone

Conditions:
  HasSortKey: !Not [!Equals [!Ref 'SortKeyName', '']]
  HasTtl: !Not [!Equals [!Ref 'TimeToLiveAttributeName', '']]
  HasIndex: !Not [!Equals [!Ref 'IndexPartitionKeyName', '']]
  HasIndexSortKey: !Not [!Equals [!Ref 'IndexSortKeyName', '']]
  IsProvisioned: !Equals [!Ref 'BillingMode', 'PROVISIONED']

Resources:
  # Retained on delete. A table is the data, and a stack delete is an operator action that should not
  # be able to discard it -- teardown deletes it explicitly, after a snapshot decision.
  Table:
    Type: 'AWS::DynamoDB::Table'
    DeletionPolicy: 'Retain'
    UpdateReplacePolicy: 'Retain'
    Properties:
      TableName: !Sub '${Application}-${TableName}'
      BillingMode: !Ref 'BillingMode'
      ProvisionedThroughput: !If
        - 'IsProvisioned'
        - ReadCapacityUnits: !Ref 'ReadCapacityUnits'
          WriteCapacityUnits: !Ref 'WriteCapacityUnits'
        - !Ref 'AWS::NoValue'

      # Only key and index attributes are declared. DynamoDB is schemaless for everything else, which
      # is the property that makes it a poor fit when you actually want a schema enforced.
      AttributeDefinitions:
        !If
          - 'HasSortKey'
          - !If
            - 'HasIndex'
            - !If
              - 'HasIndexSortKey'
              - - AttributeName: !Ref 'PartitionKeyName'
                  AttributeType: !Ref 'PartitionKeyType'
                - AttributeName: !Ref 'SortKeyName'
                  AttributeType: !Ref 'SortKeyType'
                - AttributeName: !Ref 'IndexPartitionKeyName'
                  AttributeType: 'S'
                - AttributeName: !Ref 'IndexSortKeyName'
                  AttributeType: 'S'
              - - AttributeName: !Ref 'PartitionKeyName'
                  AttributeType: !Ref 'PartitionKeyType'
                - AttributeName: !Ref 'SortKeyName'
                  AttributeType: !Ref 'SortKeyType'
                - AttributeName: !Ref 'IndexPartitionKeyName'
                  AttributeType: 'S'
            - - AttributeName: !Ref 'PartitionKeyName'
                AttributeType: !Ref 'PartitionKeyType'
              - AttributeName: !Ref 'SortKeyName'
                AttributeType: !Ref 'SortKeyType'
          - !If
            - 'HasIndex'
            - !If
              - 'HasIndexSortKey'
              - - AttributeName: !Ref 'PartitionKeyName'
                  AttributeType: !Ref 'PartitionKeyType'
                - AttributeName: !Ref 'IndexPartitionKeyName'
                  AttributeType: 'S'
                - AttributeName: !Ref 'IndexSortKeyName'
                  AttributeType: 'S'
              - - AttributeName: !Ref 'PartitionKeyName'
                  AttributeType: !Ref 'PartitionKeyType'
                - AttributeName: !Ref 'IndexPartitionKeyName'
                  AttributeType: 'S'
            - - AttributeName: !Ref 'PartitionKeyName'
                AttributeType: !Ref 'PartitionKeyType'

      KeySchema: !If
        - 'HasSortKey'
        - - AttributeName: !Ref 'PartitionKeyName'
            KeyType: 'HASH'
          - AttributeName: !Ref 'SortKeyName'
            KeyType: 'RANGE'
        - - AttributeName: !Ref 'PartitionKeyName'
            KeyType: 'HASH'

      GlobalSecondaryIndexes: !If
        - 'HasIndex'
        - - IndexName: !Sub '${IndexPartitionKeyName}-index'
            KeySchema: !If
              - 'HasIndexSortKey'
              - - AttributeName: !Ref 'IndexPartitionKeyName'
                  KeyType: 'HASH'
                - AttributeName: !Ref 'IndexSortKeyName'
                  KeyType: 'RANGE'
              - - AttributeName: !Ref 'IndexPartitionKeyName'
                  KeyType: 'HASH'
            Projection:
              ProjectionType: 'ALL'
            ProvisionedThroughput: !If
              - 'IsProvisioned'
              - ReadCapacityUnits: !Ref 'ReadCapacityUnits'
                WriteCapacityUnits: !Ref 'WriteCapacityUnits'
              - !Ref 'AWS::NoValue'
        - !Ref 'AWS::NoValue'

      SSESpecification:
        SSEEnabled: true
        SSEType: 'KMS'
        KMSMasterKeyId: !Ref 'KmsKeyArn'

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !Ref 'EnablePointInTimeRecovery'

      TimeToLiveSpecification: !If
        - 'HasTtl'
        - AttributeName: !Ref 'TimeToLiveAttributeName'
          Enabled: true
        - !Ref 'AWS::NoValue'

      Tags:
        - Key: 'Application'
          Value: !Ref 'Application'
        - Key: 'Resource'
          Value: !Sub 'dynamodb-table-${TableName}'

Outputs:
  TableName:
    Description: 'Qualified table name — put this in the consuming service environment'
    Value: !Ref 'Table'
    Export:
      Name: !Sub '${AWS::StackName}-table-name'

  TableArn:
    Description: 'Table ARN — scope the consuming task role to exactly this'
    Value: !GetAtt 'Table.Arn'
    Export:
      Name: !Sub '${AWS::StackName}-table-arn'

  StreamArn:
    Description: >-
      Empty in v1 — no stream is enabled. Listed so a consumer sees the absence rather than assuming a
      stream exists.
    Value: 'none'
